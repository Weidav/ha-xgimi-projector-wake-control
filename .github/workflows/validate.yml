name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  code-quality-and-tests:
    name: Code Quality, Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen || uv sync

      - name: Run Ruff linter & formatter check
        run: |
          uv run ruff check custom_components/xgimi tests/
          uv run ruff format --check custom_components/xgimi tests/

      - name: Run Pyright type check
        run: uv run pyright custom_components/xgimi

      - name: Run Deptry dependency check
        run: uv run deptry custom_components/xgimi

      - name: Run Pytest suite with coverage
        run: |
          uv run pytest -v --cov=custom_components/xgimi --cov-report=term --cov-report=xml --cov-report=html
          uv run coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore

  hassfest:
    name: Hassfest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Home Assistant Hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run HACS Action
        uses: hacs/action@22.5.0
        with:
          category: integration
