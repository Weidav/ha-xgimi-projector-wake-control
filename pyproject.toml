[project]
name = "ha-xgimi"
version = "0.0.8"
description = "Standalone Home Assistant HACS integration for XGIMI Projector Wake & Control"
readme = "README.md"
requires-python = ">=3.13.2"
dependencies = [
    "aiohttp>=3.0.0",
    "cryptography>=46.0.0",
    "homeassistant>=2026.0.0",
    "voluptuous>=0.15.0",
]

[dependency-groups]
dev = [
    "deptry>=0.25.0",
    "pyrefly>=1.4.0",
    "pytest-homeassistant-custom-component>=0.13.0",
    "pytest>=9.0.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120

[tool.pyright]
typeCheckingMode = "strict"
include = ["custom_components"]
ignore = ["tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pyrefly]
project-includes = ["custom_components"]
infer-with-first-use = false
min-severity = "warn"
# preset = "strict" # TODO: check if this even makes sense or is overkill for this project
