[project]
name = "ha-xgimi"
version = "1.0.0"
description = "Standalone Home Assistant HACS integration for XGIMI Projector Wake & Control"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "homeassistant>=2024.11.0",
    "pytest-homeassistant-custom-component>=0.13.180",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 120

[tool.pyright]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
asyncio_mode = "auto"
